<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My OrendaBox app</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#183436;background:#f5f8f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dce7e4;padding:20px 28px}main{max-width:960px;margin:auto;padding:40px 24px}h1{font-size:32px;letter-spacing:-.8px;margin:0 0 10px}h2{font-size:19px;margin:0 0 12px}p{color:#546c6a;line-height:1.6}section{background:#fff;border:1px solid #dce7e4;border-radius:14px;padding:24px;margin:24px 0}button{background:#17665f;color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #6cb3a8;outline-offset:3px}button:disabled{opacity:.65;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#f5f8f7;padding:16px;border-radius:8px}[role=alert]{color:#9b3333}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:#17665f}@media(max-width:500px){main{padding:24px 16px}section{padding:18px}h1{font-size:26px}}
</style></head><body><header><strong>OrendaBox</strong> / My app</header><main><div class="eyebrow">Your workspace</div><h1>My OrendaBox app</h1><p id="identity" role="status">Checking your Edge Console session…</p><section><h2>Connected to your Box</h2><p>Your app uses the session from Edge Console. Settings and Box services stay behind the app’s approved permissions.</p><button id="refresh">Check connection</button><p id="status" role="status"></p><pre id="context" hidden></pre></section></main>
<script>
const identity=document.getElementById('identity'), status=document.getElementById('status'), button=document.getElementById('refresh'), context=document.getElementById('context');
fetch('api/session').then(async r=>{if(!r.ok)throw Error('Open this app from Edge Console to continue.');return r.json()}).then(({user})=>{identity.textContent='Signed in as '+user.name;}).catch(error=>{identity.textContent=error.message;identity.setAttribute('role','alert');button.disabled=true;});
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Connecting…';status.setAttribute('role','status');context.hidden=true;try{const r=await fetch('api/context');const value=await r.json();if(!r.ok)throw Error(value.error||'Connection unavailable');context.textContent=JSON.stringify(value,null,2);context.hidden=false;status.textContent='Your Box is connected.';}catch(error){status.textContent=error.message;status.setAttribute('role','alert');}finally{button.disabled=false;}});
</script></body></html>
